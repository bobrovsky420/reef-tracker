# Codemagic CI — iOS release builds (U-iOS phase 3).
#
# Android releases stay local (scripts/build-release.ps1); this workflow exists
# because iOS can only be built on macOS. Personal Codemagic accounts get
# 500 free mac_mini_m2 minutes/month — builds are started manually from the
# Codemagic UI (no `triggering:` section) so pushes don't burn minutes.
#
# One-time setup in the Codemagic UI before the first build:
#   1. Teams > Personal account > Integrations > Developer Portal: add the
#      App Store Connect API key (.p8) and name it exactly as referenced
#      below in `integrations.app_store_connect`.
#   2. Nothing else — `ios_signing` makes Codemagic create and manage the
#      distribution certificate + provisioning profile for the bundle id.
#
# iCloud backup (U44) prerequisite, once, in the Apple developer portal:
# the App ID cz.reeftracker.reeftracker needs the iCloud capability with
# container iCloud.cz.reeftracker.reeftracker (matching Runner.entitlements),
# or signing fails with an entitlement/profile mismatch. Codemagic's
# automatic signing picks the capability up from the App ID after that.
workflows:
  ios-release:
    name: iOS release → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Must match the API-key name added in Codemagic > Integrations.
      app_store_connect: ReefTracker ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cz.reeftracker.reeftracker
      # Pinned (T20): the workflow producing the store artifact must not float.
      # 3.44.6 = the locally validated toolchain (scripts/build-release.ps1 and
      # the dev machine); 26.4 = what `latest` resolved to for the last green
      # TestFlight build (2026-08-02). Bump both deliberately, together with
      # ci.yml's flutter-version, never by image drift.
      flutter: 3.44.6
      xcode: "26.4"
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Run tests
        # The full suite runs locally before every release too; drop this step
        # if free minutes get tight — it's a repeat, not the only gate.
        # `--exclude-tags golden` is mandatory here: the golden PNGs are
        # generated on Windows and macOS rasterizes text differently, so they
        # fail on CI by construction (see dart_test.yaml).
        script: flutter test --exclude-tags golden
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        # Version + build number come from pubspec.yaml (single stream shared
        # with Android, see CLAUDE.md) — no CI-side overrides.
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # T20: no Podfile/Podfile.lock is committed yet (they only materialize on
      # macOS). Exposed as artifacts so the next green build's pair can be
      # downloaded and committed, locking the transitive pod set.
      - ios/Podfile
      - ios/Podfile.lock
    publishing:
      app_store_connect:
        auth: integration
        # Upload every successful build to TestFlight; promotion to the App
        # Store release is done manually in App Store Connect.
        submit_to_testflight: true
      email:
        recipients:
          - bobrovsky@seznam.cz
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # Release workflow. Same build as `ios-release` above, plus the localized
  # "What's New" for every language. Start it from the Codemagic UI ONLY when
  # cutting a real release — ordinary test builds keep using `ios-release`,
  # which is deliberately left untouched so it cannot regress.
  #
  # The steps are duplicated rather than shared through YAML anchors: this file
  # cannot be validated on Windows, so keeping the two workflows independent
  # means a mistake here can never break the working TestFlight path.
  #
  # NOTHING IS SUBMITTED FOR REVIEW YET — see the two flags marked (1) and (2)
  # at the bottom. The first run only writes metadata, so you can read it in
  # App Store Connect before anything reaches Apple.
  ios-store-release:
    name: iOS release → App Store (notes + submit)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: ReefTracker ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cz.reeftracker.reeftracker
      # Pinned (T20) — keep identical to ios-release above; bump together.
      flutter: 3.44.6
      xcode: "26.4"
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Run tests
        # Goldens excluded — Windows-generated PNGs, see dart_test.yaml.
        script: flutter test --exclude-tags golden
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Push localized What's New
        # Uses Codemagic's own `app-store-connect` CLI, not fastlane: `deliver`
        # prompts for confirmation when it finds no Deliverfile and then dies
        # ("Could not retrieve response as fastlane runs in non-interactive
        # mode"). This tool is pre-installed, never interactive, and reads the
        # same APP_STORE_CONNECT_* variables the integration already exports.
        script: |
          set -e
          # Version name without the +build suffix — the App Store version
          # record this metadata belongs to (single stream, see CLAUDE.md).
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          NOTES="store_assets/release_notes/$VERSION/appstore"
          echo "Publishing release notes for $VERSION from $NOTES"
          test -d "$NOTES" || { echo "No release notes for $VERSION — write them first (CLAUDE.md)"; exit 1; }

          cat > /tmp/publish_notes.py <<'PY'
          import json, os, subprocess, sys

          version, notes_dir = sys.argv[1], sys.argv[2]
          BUNDLE_ID = "cz.reeftracker.reeftracker"

          def asc(*args):
              """Run an app-store-connect query and return its parsed JSON."""
              r = subprocess.run(["app-store-connect", *args, "--json"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit("app-store-connect {} failed:\n{}".format(" ".join(args), r.stderr))
              data = json.loads(r.stdout or "[]")
              # Tolerate a {"data": [...]} envelope and a single-resource dict.
              if isinstance(data, dict):
                  data = data.get("data", data)
              if isinstance(data, dict):
                  data = [data]
              return data

          def attr(obj, name):
              """Field lookup that tolerates both flat and {attributes:{}} shapes."""
              return (obj.get("attributes") or {}).get(name, obj.get(name))

          apps = asc("apps", "list", "--bundle-id-identifier", BUNDLE_ID,
                     "--strict-match-identifier")
          if not apps:
              sys.exit("No app found for bundle id " + BUNDLE_ID)
          app_id = apps[0]["id"]

          versions = asc("apps", "app-store-versions", app_id,
                         "--version-string", version, "--platform", "IOS")
          if not versions:
              sys.exit("No App Store version record for {} — create it in App Store "
                       "Connect first, then re-run this build.".format(version))
          version_id = versions[0]["id"]

          existing = {attr(l, "locale"): l["id"]
                      for l in asc("app-store-versions", "localizations", version_id)}

          updated, skipped = [], []
          for locale in sorted(os.listdir(notes_dir)):
              path = os.path.join(notes_dir, locale, "release_notes.txt")
              if not os.path.isfile(path):
                  continue
              loc_id = existing.get(locale)
              if not loc_id:
                  # The listing has no such language — never silently drop it.
                  skipped.append(locale)
                  continue
              r = subprocess.run(["app-store-connect", "app-store-version-localizations",
                                  "modify", loc_id, "--whats-new", "@file:" + path])
              if r.returncode != 0:
                  sys.exit("Failed to set What's New for " + locale)
              updated.append(locale)

          print("What's New updated for: " + (", ".join(updated) or "NOTHING"))
          if skipped:
              print("SKIPPED — no such locale on the App Store listing: " + ", ".join(skipped))
          if not updated:
              sys.exit("No locale was updated — check the listing's languages.")
          PY

          python3 /tmp/publish_notes.py "$VERSION" "$NOTES"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      # T20: no Podfile/Podfile.lock is committed yet (they only materialize on
      # macOS). Exposed as artifacts so the next green build's pair can be
      # downloaded and committed, locking the transitive pod set.
      - ios/Podfile
      - ios/Podfile.lock
    publishing:
      app_store_connect:
        auth: integration
        # The release candidate still lands in TestFlight first.
        submit_to_testflight: true
        # (2) flip to true once a dry run has shown the notes land correctly —
        # and uncomment `release_type` below in the SAME edit. Codemagic rejects
        # the config if `release_type` is present without App Store submission
        # ("App Store review submission is required for release_type"), so the
        # two keys travel together.
        submit_to_app_store: false
        # Keep MANUAL when you enable it: an approval at 3am must not put the
        # build in front of every user on its own — 1.1.0 resets customised
        # parameter bounds.
        # release_type: MANUAL
      email:
        recipients:
          - bobrovsky@seznam.cz
        notify:
          success: true
          failure: true

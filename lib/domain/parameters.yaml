# Parameter catalog — SOURCE OF TRUTH for every trackable water parameter
# (core dashboard set + the ICP microelement panel).
#
# After editing this file, regenerate the Dart catalog with:
#     dart run tool/gen_parameters.dart
# (the generator validates this file and writes parameter_catalog.g.dart).
#
# Notes:
#  - `key` is a STABLE identifier persisted in the database (readings,
#    tracked-parameter rows, dosing entries) — never rename or reuse a key.
#  - Catalog ORDER matters: it is the display order of the micro panel and
#    the fallback order elsewhere.
#  - `unit` is the display unit label. Editable per tank for core parameters;
#    FIXED for microelements (category other than core), where it must be the
#    unit printed on an ICP report: mg/L or µg/L — and for any parameter with
#    a `displayFactor` other than 1 (nitrite's ppb).
#  - `decimals` = display precision (0–4).
#  - `category`: core (dashboard; the default when omitted), major, trace or
#    contaminant (the latter three = the Microelements screen, U17).
#  - `group` = the fixed dashboard section a core parameter renders in
#    (REDESIGN #6): core, nutrients or environment. REQUIRED for core
#    parameters, forbidden for microelements.
#  - `symbol` = chemical element symbol ("Zn"), REQUIRED for microelements so
#    rows match an ICP report; omit for core parameters.
#  - `displayFactor` = canonical→display multiplier (default 1). Storage stays
#    canonical ppm (mg/L) for every concentration; µg/L elements — and ppb
#    nitrite — display through factor 1000. A factor other than 1 fixes the
#    unit (the label must match the converted value, so it can't be edited).
#  - `minValue` / `plausibleMin` / `plausibleMax` are in the CANONICAL unit:
#    minValue = hard physical floor (reject below), the plausible pair = the
#    generous range outside which a value needs explicit confirmation (#31).
#    Define both plausible bounds or neither.
#  - `importance` = relative weight in the health/stability aggregates
#    (default 1; parameters whose swings harm livestock fastest weigh most).
#    Core-only — microelements are excluded from both scores.
#  - `maxDailyRise` = maximum safe correction rise per day in the CANONICAL
#    unit; the dose calculator splits a correction that would rise faster.
#    Omit = no established limit, the correction applies in one dose.
#  - `defaultBounds` = default zone bounds (amberLow/greenLow/greenHigh/
#    amberHigh) in the CANONICAL unit — REQUIRED for microelements (the
#    fallback when a tank has no TrackedParameters row for the element, and
#    the seed when one is created), and OPTIONAL for a core parameter whose
#    recommended range does not vary by setup type (currently ORP). Core
#    setup-specific defaults remain in presets.dart. One-sided "keep low"
#    elements omit the low pair (no "too little lead"); an amber bound
#    requires its green partner, present bounds must be ascending and inside
#    the plausible range.

parameters:
  # --- Core dashboard parameters -------------------------------------------
  - key: temperature
    unit: "°C"
    decimals: 1
    group: environment
    importance: 3
    minValue: 0
    plausibleMin: 10
    plausibleMax: 40

  - key: ph
    unit: pH
    decimals: 2
    group: environment
    importance: 2.5
    minValue: 0
    plausibleMin: 5
    plausibleMax: 10

  - key: salinity
    unit: SG
    decimals: 3
    group: environment
    importance: 3
    minValue: 1.0
    plausibleMin: 1.0
    plausibleMax: 1.05

  - key: alkalinity
    unit: dKH
    decimals: 1
    group: core
    importance: 3
    maxDailyRise: 1.4
    minValue: 0
    plausibleMin: 0
    plausibleMax: 30

  - key: calcium
    unit: ppm
    decimals: 0
    group: core
    importance: 2
    maxDailyRise: 50
    minValue: 0
    plausibleMin: 100
    plausibleMax: 1000

  - key: magnesium
    unit: ppm
    decimals: 0
    group: core
    importance: 2
    maxDailyRise: 100
    minValue: 0
    plausibleMin: 800
    plausibleMax: 2000

  - key: nitrate
    unit: ppm
    decimals: 1
    group: nutrients
    importance: 2
    minValue: 0
    plausibleMin: 0
    plausibleMax: 250

  - key: phosphate
    unit: ppm
    decimals: 2
    group: nutrients
    importance: 2
    minValue: 0
    plausibleMin: 0
    plausibleMax: 5

  - key: ammonia
    unit: ppm
    decimals: 2
    group: nutrients
    importance: 3
    minValue: 0
    plausibleMin: 0
    plausibleMax: 10

  # Stored canonical ppm like every concentration but DISPLAYED in ppb
  # (displayFactor 1000): matches the Hanna nitrite LR checker's unit and
  # keeps sub-0.01 ppm readings legible. The unit is fixed (not per-tank
  # editable), like the µg/L microelements.
  - key: nitrite
    unit: ppb
    decimals: 0
    group: nutrients
    importance: 3
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 10

  # ORP can dip below zero in anoxic conditions — no hard floor.
  - key: orp
    unit: mV
    decimals: 0
    group: environment
    plausibleMin: -300
    plausibleMax: 700
    # ORP is best treated as a broad trend rather than a set point. Neptune
    # describes 250–400 mV as a normal settled range with no single right
    # number; 450–500 mV is the commonly cited upper caution band for ozone.
    defaultBounds: { amberLow: 200, greenLow: 250, greenHigh: 450, amberHigh: 500 }

  # --- Microelements (U17): the ICP panel ----------------------------------
  # Categories major/trace/contaminant surface on the Microelements screen,
  # not the dashboard. Canonical storage stays ppm (mg/L) for every
  # concentration; display units are fixed per element to match the ICP
  # report (Fauna Marin): mg/L for the macroelement/halogen/nutrient rows
  # (Na, K, S, B, Br, Sr, I, Si), µg/L via displayFactor 1000 for trace
  # elements and contaminants. Strontium, iodine, iron and potassium predate
  # the panel: their keys and stored ppm values are unchanged, they only
  # moved category (iron additionally gained the µg/L display, which is
  # presentation-only).
  #
  # `defaultBounds` are sensible starting points anchored on natural seawater
  # (NSW at 35 ppt: Na ~10 760, K ~400, S ~905, B ~4.4, Br ~65, Sr ~8.1 ppm;
  # I ~60 µg/L, Mo ~10 µg/L, Li ~180 µg/L, Ba ~10–15 µg/L) and the target
  # ranges ICP labs publish — editable per tank exactly like core-parameter
  # bounds. Fe, Si, Zn, V, Cu, Ni, Mo, Li, Al, Sb, Sn, Ag, W, La, Ti, As,
  # Cd, Hg and Pb follow the Fauna Marin lab reference bands (their report
  # gauges' green/yellow zones). Sr deliberately follows that report's prose
  # recommendation (7–10 mg/L) instead of its gauge (6.5–8.0), whose green
  # band sits below NSW (~8.1) and would amber-flag a natural-seawater tank
  # (TODO.md #81 comment 4, decided 2026-08-02). Where that lab publishes only a reference
  # range and no gauge (the contaminants), the range end is `greenHigh` and
  # `amberHigh` is +10% — the ratio their gauged elements use throughout.
  # Contaminants keep one-sided bounds even where the lab states a lower
  # reference bound: "too little lead/lanthanum/titanium" is not a condition
  # worth alarming on. `hobbyKit` marks the elements
  # hobbyists test at home between ICPs (Salifert/Red Sea kits exist for
  # these) — the compact filter of the micro entry form.
  - key: strontium
    unit: mg/L
    decimals: 1
    category: trace
    symbol: Sr
    hobbyKit: true
    minValue: 0
    plausibleMin: 0
    plausibleMax: 50
    defaultBounds: { amberLow: 6.5, greenLow: 7.0, greenHigh: 10.0, amberHigh: 11.0 }

  # Iodine sits with the halogens on the report, in mg/L (e.g. 0.102) —
  # three decimals cover the reference-range resolution (0.055–0.080).
  - key: iodine
    unit: mg/L
    decimals: 3
    category: trace
    symbol: I
    hobbyKit: true
    minValue: 0
    plausibleMin: 0
    plausibleMax: 2
    defaultBounds: { amberLow: 0.03, greenLow: 0.05, greenHigh: 0.08, amberHigh: 0.12 }

  - key: iron
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Fe
    displayFactor: 1000
    hobbyKit: true
    minValue: 0
    plausibleMin: 0
    plausibleMax: 2
    defaultBounds: { greenHigh: 0.0025, amberHigh: 0.0028 }

  # Major ions (mg/L on ICP reports; wide tolerances).
  - key: sodium
    unit: mg/L
    decimals: 0
    category: major
    symbol: Na
    minValue: 0
    plausibleMin: 3000
    plausibleMax: 20000
    defaultBounds: { amberLow: 9500, greenLow: 10000, greenHigh: 11200, amberHigh: 12000 }

  # Potassium predates the panel as a core dashboard parameter — key and
  # stored ppm values unchanged, it only moved category (and its label from
  # ppm to the equivalent mg/L).
  - key: potassium
    unit: mg/L
    decimals: 0
    category: major
    symbol: K
    minValue: 0
    plausibleMin: 100
    plausibleMax: 800
    defaultBounds: { amberLow: 340, greenLow: 380, greenHigh: 420, amberHigh: 460 }

  - key: sulfur
    unit: mg/L
    decimals: 0
    category: major
    symbol: S
    minValue: 0
    plausibleMin: 200
    plausibleMax: 2000
    defaultBounds: { amberLow: 780, greenLow: 850, greenHigh: 980, amberHigh: 1100 }

  - key: boron
    unit: mg/L
    decimals: 1
    category: major
    symbol: B
    minValue: 0
    plausibleMin: 0
    plausibleMax: 20
    defaultBounds: { amberLow: 3.0, greenLow: 3.8, greenHigh: 5.5, amberHigh: 7.0 }

  - key: bromine
    unit: mg/L
    decimals: 0
    category: major
    symbol: Br
    minValue: 0
    plausibleMin: 0
    plausibleMax: 300
    defaultBounds: { amberLow: 45, greenLow: 55, greenHigh: 75, amberHigh: 95 }

  # Silicon sits with the majors on ICP reports — in mg/L like them (e.g.
  # 0.2). Labs treat it as two-sided: too much feeds diatoms, too little
  # shows as green film algae and poor sponge growth. The low side is
  # deliberately SOFT (TODO.md #81 comment 6, decided 2026-08-02): `amberLow`
  # is 0, so the whole 0–0.1 range — including the zero many reefkeepers run
  # on purpose — classifies amber, never red (nothing can sit below a 0
  # amberLow, and zones.dart only reds beyond a *defined* amber bound). The
  # FM gauge's red-at-zero shape (amberLow == greenLow == 0.1) was rejected
  # as an alarm generator on healthy tanks.
  - key: silicon
    unit: mg/L
    decimals: 2
    category: major
    symbol: Si
    minValue: 0
    plausibleMin: 0
    plausibleMax: 10
    defaultBounds: { amberLow: 0.0, greenLow: 0.1, greenHigh: 0.2, amberHigh: 0.22 }

  # Desirable trace elements (µg/L range).
  - key: zinc
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Zn
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.0027, greenLow: 0.003, greenHigh: 0.008, amberHigh: 0.0088 }

  - key: vanadium
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: V
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.0018, greenLow: 0.002, greenHigh: 0.01, amberHigh: 0.011 }

  - key: copper
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Cu
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.0018, greenLow: 0.002, greenHigh: 0.006, amberHigh: 0.0066 }

  - key: nickel
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Ni
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.0027, greenLow: 0.003, greenHigh: 0.006, amberHigh: 0.0066 }

  - key: manganese
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Mn
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { greenHigh: 0.005, amberHigh: 0.02 }

  - key: molybdenum
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Mo
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.009, greenLow: 0.01, greenHigh: 0.02, amberHigh: 0.022 }

  - key: chromium
    unit: "µg/L"
    decimals: 2
    category: trace
    symbol: Cr
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { greenHigh: 0.001, amberHigh: 0.005 }

  - key: cobalt
    unit: "µg/L"
    decimals: 2
    category: trace
    symbol: Co
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { greenHigh: 0.001, amberHigh: 0.004 }

  - key: lithium
    unit: "µg/L"
    decimals: 0
    category: trace
    symbol: Li
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 5
    defaultBounds: { amberLow: 0.162, greenLow: 0.18, greenHigh: 0.35, amberHigh: 0.385 }

  - key: barium
    unit: "µg/L"
    decimals: 1
    category: trace
    symbol: Ba
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { amberLow: 0.001, greenLow: 0.004, greenHigh: 0.02, amberHigh: 0.05 }

  - key: selenium
    unit: "µg/L"
    decimals: 2
    category: trace
    symbol: Se
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 1
    defaultBounds: { greenHigh: 0.005, amberHigh: 0.015 }

  # Contaminants: wanted near zero, one-sided default bounds (ceilings
  # roughly at "reports start flagging this").
  - key: aluminium
    unit: "µg/L"
    decimals: 1
    category: contaminant
    symbol: Al
    displayFactor: 1000
    minValue: 0
    plausibleMin: 0
    plausibleMax: 2

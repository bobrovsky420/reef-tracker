# Salt-mix catalogue — SOURCE OF TRUTH for the salinity planner.
#
# After editing this file, regenerate the Dart catalogue with:
#     dart run tool/gen_salt_mixes.dart
# (the generator validates this file and writes salt_mix_catalog.g.dart).
#
# Rules:
#  - Listing order is the picker order.
#  - `key` is persisted in aquarium data and backups. Never rename, reuse, or
#    repurpose it; add a new key when a formulation needs a distinct identity.
#  - Brand and product names are proper nouns and are not localized.
#  - `gramsPerLiter` is the manufacturer's weight ratio normalized to g/L.
#  - `referenceSalinity.unit` is `ppt` or `sg`. SG references are converted by
#    the app's existing 25 °C conversion when the generated catalogue loads.
#  - `basis` controls the warning shown beside an untouched catalogue seed:
#      finalPreparedWater  — weight explicitly makes a final prepared volume
#      manufacturerRatio  — direct manufacturer g/L ratio
#      sourceWaterEstimate — salt added per initial source-water volume
#      batchBackedEstimate — range/ratio supported by batch analysis
#  - Every value is only a first-selection seed. A keeper-measured calibration
#    is stored per aquarium/product and always wins afterward.
#  - `sourceUrl` must be the manufacturer evidence for the number, and
#    `verifiedOn` records when that evidence was last checked (YYYY-MM-DD).


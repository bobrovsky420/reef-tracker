# The Pro feature registry (U19) — source of truth for which features sit
# behind the future paid tier and which of them early adopters keep for free.
#
# Edit this file, then regenerate:
#     dart run tool/gen_pro_features.dart
#
# Each entry:
#   key:           camelCase Dart identifier — becomes a `ProFeature` enum value.
#                  Keys are never persisted anywhere (entitlement state is the
#                  `legacy_free_since` marker + the future purchase), so they
#                  can be renamed freely.
#   grandfathered: true  = the feature existed at the monetization cutoff and
#                          stays free FOREVER for Founder's Edition installs.
#                          NEVER flip true -> false — that breaks the public
#                          promise (test/pro_features_test.dart pins the set).
#                  false = built after the cutoff; paid for everyone once the
#                          Pro tier exists.
#   boundaries:    every authoritative enforcement point for the capability.
#                  `id` is a globally unique camelCase Dart identifier;
#                  `kind` is routeResource, command, presentation, or
#                  configuration. Entry buttons reuse these IDs for the
#                  paywall, but do not count as separate boundaries.
#
# DECIDED 2026-08-05 — every Pro feature delivered BEFORE the paid tier is
# switched on ships `grandfathered: true`. No per-feature deliberation.
#
# This does not cost the tier anything, which is easy to get backwards: the
# gate is `purchased || (legacyFree && grandfathered)`, so grandfathering only
# ever helps a *Founder*. A Standard install — every install created after
# activation — gets nothing from it and meets the paywall on every key here.
# `grandfathered: false` is reserved for capabilities invented AFTER
# activation that even Founders should pay for; it is a deliberate decision
# each time, never a default.
#
# Same decision, second half: **same capability for another brand joins the
# existing key** (new ICP labs -> `icpImport`, new hardware vendors ->
# `connectedDevices`). Another lab or another pump is the capability the
# Founder was already promised; charging for it would be retrading the promise
# on a technicality. A genuinely new capability gets its own key.
#
# Retiering a feature (free -> Pro) = adding an entry here + gating its UI
# surfaces with `proFeatureProvider`; git history is the audit trail.

features:
  - key: icpImport
    grandfathered: true
    boundaries:
      - id: icpImportCommit
        kind: command
  - key: doseCalculator
    grandfathered: true
    boundaries:
      - id: doseCalculatorRoute
        kind: routeResource
  - key: unlimitedTanks
    grandfathered: true
    boundaries:
      - id: unlimitedTankCreate
        kind: command
  - key: stabilityScore
    grandfathered: true
    boundaries:
      - id: stabilityScorePresentation
        kind: presentation
  # One gate for cloud backup sync on both platforms — Google Drive on
  # Android (U24), iCloud Drive on iOS (U44). Renamed from `driveSync`
  # 2026-08-01 when the iCloud half was built: keys are never persisted, and
  # to a keeper this is one capability ("my backups live in the cloud") —
  # the connectedDevices merge precedent. Grandfathering carries over
  # unchanged, so Founder installs get it free on either platform.
  - key: cloudSync
    grandfathered: true
    boundaries:
      - id: cloudSyncEnable
        kind: command
      - id: cloudSyncPush
        kind: command
  - key: smartInsights
    grandfathered: true
    boundaries:
      - id: smartInsightsPresentation
        kind: presentation
  # U32 Hanna Lab measurement import — grandfathered by explicit 2026-07-19
  # decision (same reasoning as driveSync/stabilityScore/smartInsights:
  # usable immediately, Founder installs keep it free forever).
  - key: hannaImport
    grandfathered: true
    boundaries:
      - id: hannaImportCommit
        kind: command
  # U33 Hanna checker direct BLE connection (experimental) — grandfathered
  # per the 2026-07-21 decision, consistent with hannaImport (the same
  # meter's file-based sibling path).
  - key: hannaConnect
    grandfathered: true
    boundaries:
      - id: hannaConnectRoute
        kind: routeResource
  # U34 checker camera scan (experimental) — grandfathered per the
  # 2026-07-21 decision, consistent with hannaConnect/hannaImport (the
  # third acquisition path for the same Hanna readings).
  - key: hannaScan
    grandfathered: true
    boundaries:
      - id: hannaScanRoute
        kind: routeResource
  # Local-device integrations — ReefFactory meters (U36), Red Sea ReefBeat
  # devices (U38) and Neptune Apex controllers (U40) — behind ONE gate as of
  # the 2026-07-27 decision. They were three separate grandfathered keys
  # (reefFactory/reefBeat/apex); to a keeper they are a single capability
  # ("connect my hardware"), and the combined Devices page would otherwise be a
  # patchwork of per-vendor locks. Every future vendor joins this key rather
  # than adding its own.
  #
  # Merging keys does NOT weaken the founder promise: keys are never persisted
  # (entitlement is the legacy_free marker), all three were grandfathered, and
  # the merged key is too — so every install that had all three free still has
  # all three free. The Hanna gates stay separate: the checker is the keeper's
  # own test kit, not a piece of tank hardware on the LAN.
  - key: connectedDevices
    grandfathered: true
    boundaries:
      - id: connectedDeviceLiveIo
        kind: command
  # U49 wall display mode — its own key, not a connectedDevices rider: the
  # mode works with zero devices (stored readings still make a useful wall
  # board), so a hardware gate would charge the wrong people for the wrong
  # reason. Grandfathered per the standing 2026-08-05 rule (shipped before
  # activation).
  - key: wallDisplay
    grandfathered: true
    boundaries:
      - id: wallDisplayRoute
        kind: routeResource
      - id: wallDisplayAutoStart
        kind: configuration
